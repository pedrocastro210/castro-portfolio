<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon: SVG (navegadores modernos) + PNGs de fallback (Safari,
         indexação do Google, etc.) + ícones de instalação (iOS/Android). -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://castro-portfolio-landing.vercel.app/" />

    <title>Pedro Castro — Sites que vendem</title>
    <meta
      name="description"
      content="Pedro Castro — desenvolvedor full-stack. Sites e landing pages sob medida, com animação e performance de verdade."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pedro Castro" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://castro-portfolio-landing.vercel.app/" />
    <meta property="og:title" content="Pedro Castro — Sites que vendem" />
    <meta
      property="og:description"
      content="Desenvolvedor full-stack. Sites e landing pages sob medida, com animação e performance de verdade."
    />
    <meta property="og:image" content="https://castro-portfolio-landing.vercel.app/img/pedro-portrait.jpg" />
    <meta property="og:image:width" content="896" />
    <meta property="og:image:height" content="1204" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pedro Castro — Sites que vendem" />
    <meta
      name="twitter:description"
      content="Desenvolvedor full-stack. Sites e landing pages sob medida, com animação e performance de verdade."
    />
    <meta name="twitter:image" content="https://castro-portfolio-landing.vercel.app/img/pedro-portrait.jpg" />

    <!-- Dados estruturados (Person) — ajuda o Google a entender quem é o
         dono do site e a exibir rich results (nome, foto, redes). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Pedro Castro",
        "url": "https://castro-portfolio-landing.vercel.app/",
        "image": "https://castro-portfolio-landing.vercel.app/img/pedro-portrait.jpg",
        "jobTitle": "Desenvolvedor full-stack",
        "description": "Sites e landing pages sob medida, com animação e performance de verdade.",
        "worksFor": {
          "@type": "Organization",
          "name": "Vertigo Tecnologia"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
